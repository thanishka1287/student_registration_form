<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Registered Students</title>
</head>

<body>

    <div class="container">

        <header>
            <h1>📋 Registered Students</h1>
            <p>View all registered student details</p>
        </header>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Date of Birth</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Gender</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">
                    <!-- Student data will come from the database -->
                </tbody>

            </table>

        </div>

        <div class="actions">
            <a href="sr.html">➕ Register New Student</a>
        </div>

    </div>

    <script src="students.js"></script>

</body>

</html>
