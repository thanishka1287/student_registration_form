<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Registration Form</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>Student Registration Form</h1>
            <p>Please fill out all the required details</p>
        </header>

        <form id="registration">
            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your Name here" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your valid email address" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date Of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label for="phnumber">Phone Number</label>
                    <input type="number" id="phnumber" name="phnumber" placeholder="Enter your Contact Number" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Course Enrollment</legend>

                <div class="form-group">
                    <label for="course">Select Course</label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>--Select a Course--</option>
                        <option value="Python">Python Full Stack Development</option>
                        <option value="webdev">Frontend Web Development</option>
                        <option value="datascience">DataScience</option>
                        <option value="AI">Machine learning</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-grp">
                        <label><input type="radio" name="gender" value="male">Male</label>
                        <label><input type="radio" name="gender" value="female">Female</label>
                        <label><input type="radio" name="gender" value="others">Others</label>
                    </div>
                </div>
            </fieldset>
            <button type="submit">Register</button>
        </form>
        <div id="statusMessage" class="hidden"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
